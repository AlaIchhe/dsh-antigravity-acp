name: Publish package

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          node -e "const p=require('./package.json'); const expected='v'+p.version; const tag=process.env.GITHUB_REF_NAME; if(tag!==expected){ console.error('Tag '+tag+' does not match package version '+p.version+' (expected '+expected+')'); process.exit(1) }"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run CI checks
        run: npm run check

      - name: Publish to npm with provenance
        run: |
          DIST_TAG=$(node -e "const v=require('./package.json').version; const m=v.match(/-([a-zA-Z0-9]+)/); console.log(m ? m[1] : 'latest')")
          echo "Publishing with npm dist-tag: $DIST_TAG"
          npm publish --provenance --access public --tag "$DIST_TAG"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
